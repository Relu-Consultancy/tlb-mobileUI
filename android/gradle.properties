# Sized for a 16GB machine: the Gradle daemon shares RAM with the Kotlin
# compile daemon, AAPT2/D8/R8, the Flutter tool, and the IDE, all running at
# once. -Xmx8G (confirmed via hs_err_pid30316.log) reserved more heap for
# this one process than the whole system had free during a release build's
# R8 pass. Lowered to 4G, then a SECOND crash (hs_err_pid38556.log) showed
# the daemon itself only using 1.4G of that budget when it died — the
# system-wide free RAM had simply run out (437MB free out of 16GB, mostly
# other running apps, not this build). 3G is a further safety margin on
# Gradle's side; the rest of the headroom has to come from closing other
# memory-heavy apps before a release build (see chat for what to close).
#
# org.gradle.daemon=false: a release build's daemon otherwise stays
# resident (and holding its reserved memory) after the build finishes,
# so a second attempt in the same session starts with less free RAM than
# the first — part of why this crash recurred build after build. Without
# the daemon, each `flutter build` run gets a fresh JVM that fully exits
# and releases its memory the moment the build ends. Costs ~10-20s of
# daemon startup per build; worth it until this machine has RAM to spare.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
android.useAndroidX=true
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Silences the 3 "Flutter support for your project's Gradle/AGP/Kotlin
# version will soon be dropped" advisories on every build. This is the same
# switch the `--android-skip-build-dependency-validation` CLI flag sets
# (flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt reads it as a plain
# Gradle project property, `skipDependencyChecks`, via project.hasProperty —
# setting it here has the identical effect without retyping the flag every
# build). These are soon-to-be-unsupported notices, not build failures; the
# actual Gradle 8.14 / AGP 8.11.1 / Kotlin 2.2.20 versions are unchanged.
skipDependencyChecks=true
