name: tlb_mobile_ui
description: "Event Booking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  flutter_displaymode: ^0.7.0
  video_player: ^2.11.0
  flutter_svg: ^2.2.4
  like_button: ^2.1.0
  http: ^1.2.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  showcaseview: ^5.0.2
  shared_preferences: ^2.5.5
  geolocator: ^13.0.4
  geocoding: ^3.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.2
  path_provider: ^2.1.4
  share_plus: ^7.2.2
  razorpay_flutter: ^1.3.6
  device_preview: ^1.2.0
  printing: ^5.13.0
  pdf: ^3.11.0
  custom_refresh_indicator: ^4.0.1
  palette_generator: ^0.3.3+6
  location: ^8.0.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  mocktail: ^1.0.5
  mocktail_image_network: ^1.3.0
  flutter_launcher_icons: ^0.14.1

# App launcher icon — TLB logo (matches the splash screen).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFC21A"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/new_home/
    - assets/images/event_subcategories/
    - assets/images/explore_formats/
    - assets/images/featured_partners/
    - assets/images/class_page/
    - assets/images/pick_pace/
    - assets/icons/
    - location_screen_resources/
    - resources- tlb-ui/
    - resources- tlb-ui/accounts_page/
    - resources- tlb-ui/venues_page/
    - resources- tlb-ui/venues_page/yourway/
    - resources- tlb-ui/venues_page/getmoving/
    - resources- tlb-ui/events_page/
    - resources- tlb-ui/homescreen-categoryicons/
    - resources- tlb-ui/homescreen_Explorethestage/
    - resources- tlb-ui/event_page_subcategoryicons/
    - resources- tlb-ui/event_page_subcategoryicons/Explore_by_format/
    - resources- tlb-ui/programs_findurfit/
    - resources- tlb-ui/programs_findurfit_clean/
    - resources- tlb-ui/class_page/
    - google_fonts/

  fonts:
    - family: DancingScript
      fonts:
        - asset: google_fonts/DancingScript-Variable.ttf

