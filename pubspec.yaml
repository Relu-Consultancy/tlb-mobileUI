name: tlb_mobile_ui
description: "Event Booking App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  flutter_displaymode: ^0.7.0
  video_player: ^2.11.0
  flutter_svg: ^2.2.4
  like_button: ^2.1.0
  http: ^1.2.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.2.2
  showcaseview: ^5.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  mocktail: ^1.0.5
  mocktail_image_network: ^1.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/new_home/
    - assets/images/event_subcategories/
    - assets/images/explore_formats/
    - assets/images/featured_partners/
    - assets/images/class_page/
    - assets/images/pick_pace/
    - assets/icons/
    - resources- tlb-ui/
    - resources- tlb-ui/accounts_page/
    - resources- tlb-ui/venues_page/
    - resources- tlb-ui/venues_page/yourway/
    - resources- tlb-ui/events_page/
    - resources- tlb-ui/homescreen-categoryicons/
    - google_fonts/


